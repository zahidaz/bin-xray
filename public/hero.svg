<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="400">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="text-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="400" fill="url(#bg)"/>

  <ellipse cx="200" cy="350" rx="250" ry="150" fill="#3b82f6" opacity="0.06" filter="url(#blur1)"/>
  <ellipse cx="700" cy="80" rx="200" ry="120" fill="#8b5cf6" opacity="0.06" filter="url(#blur1)"/>
  <ellipse cx="450" cy="200" rx="300" ry="180" fill="#06b6d4" opacity="0.03" filter="url(#blur1)"/>

  <g opacity="0.12" font-family="'SF Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="11" fill="#71717a">
    <text x="40" y="45">00000000</text>
    <text x="120" y="45" fill="#60a5fa">7f</text>
    <text x="140" y="45" fill="#60a5fa">45</text>
    <text x="160" y="45" fill="#60a5fa">4c</text>
    <text x="180" y="45" fill="#60a5fa">46</text>
    <text x="205" y="45" fill="#a78bfa">02</text>
    <text x="225" y="45" fill="#a78bfa">01</text>
    <text x="245" y="45" fill="#a78bfa">01</text>
    <text x="265" y="45" fill="#a78bfa">00</text>
    <text x="295" y="45">00 00 00 00 00 00 00 00</text>

    <text x="40" y="65">00000010</text>
    <text x="120" y="65" fill="#34d399">02</text>
    <text x="140" y="65" fill="#34d399">00</text>
    <text x="160" y="65" fill="#fbbf24">3e</text>
    <text x="180" y="65" fill="#fbbf24">00</text>
    <text x="205" y="65">01 00 00 00</text>
    <text x="275" y="65" fill="#f87171">40 10 00 00 00 00 00 00</text>

    <text x="40" y="85">00000020</text>
    <text x="120" y="85">40 00 00 00 00 00 00 00</text>
    <text x="275" y="85">98 31 00 00 00 00 00 00</text>

    <text x="40" y="105">00000030</text>
    <text x="120" y="105">00 00 00 00</text>
    <text x="205" y="105" fill="#a78bfa">40</text>
    <text x="225" y="105" fill="#a78bfa">00</text>
    <text x="245" y="105" fill="#34d399">38</text>
    <text x="265" y="105" fill="#34d399">00</text>
    <text x="295" y="105">0d 00 40 00 1e 00 1d 00</text>
  </g>

  <g opacity="0.10" font-family="'SF Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="11" fill="#71717a">
    <text x="530" y="290">00001040</text>
    <text x="610" y="290" fill="#f87171">ff 25 c2 2f 00 00</text>
    <text x="720" y="290">66 90</text>
    <text x="530" y="310">00001048</text>
    <text x="610" y="310" fill="#fbbf24">ff 25 ba 2f 00 00</text>
    <text x="720" y="310">66 90</text>
    <text x="530" y="330">00004000</text>
    <text x="610" y="330" fill="#34d399">46 10 00 00 00 00 00 00</text>
    <text x="530" y="350">00004008</text>
    <text x="610" y="350" fill="#34d399">00 00 00 00 00 00 00 00</text>
    <text x="530" y="370">00004010</text>
    <text x="610" y="370" fill="#60a5fa">48 65 6c 6c 6f 2c 20 57</text>
    <text x="800" y="370" fill="#52525b" font-size="10">Hello, W</text>
  </g>

  <g opacity="0.08" font-family="'SF Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="10" fill="#71717a">
    <text x="40" y="300">typedef struct {</text>
    <text x="40" y="315">  <tspan fill="#60a5fa">unsigned char</tspan> e_ident[16];</text>
    <text x="40" y="330">  <tspan fill="#34d399">Elf64_Half</tspan>    e_type;</text>
    <text x="40" y="345">  <tspan fill="#34d399">Elf64_Half</tspan>    e_machine;</text>
    <text x="40" y="360">  <tspan fill="#fbbf24">Elf64_Addr</tspan>    e_entry;</text>
    <text x="40" y="375">} <tspan fill="#a78bfa">Elf64_Ehdr</tspan>;</text>
  </g>

  <g transform="translate(450, 155)" text-anchor="middle">
    <text font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="300" fill="url(#title-grad)" filter="url(#text-glow)">
      Bin<tspan font-weight="800" fill="url(#accent)">Xray</tspan>
    </text>
  </g>

  <g transform="translate(450, 195)" text-anchor="middle">
    <text font-family="'SF Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="16" fill="#a1a1aa" letter-spacing="4">
      SEE THROUGH YOUR BINARIES
    </text>
  </g>

  <g transform="translate(450, 240)" text-anchor="middle">
    <text font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#71717a">
      Interactive ELF explorer — click bytes, decode structs, animate dynamic linking
    </text>
  </g>

  <line x1="300" y1="270" x2="600" y2="270" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>

  <rect x="0" y="0" width="900" height="1" fill="#27272a"/>
  <rect x="0" y="399" width="900" height="1" fill="#27272a"/>
</svg>
